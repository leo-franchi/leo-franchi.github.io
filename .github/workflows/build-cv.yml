name: Build CV

on:
  push:
    branches:
      - main
    paths:
      - "leonardo_franchi_cv.tex"
      - ".github/workflows/build-cv.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: leonardo_franchi_cv.tex
          texlive_version: 2026

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add leonardo_franchi_cv.pdf

          if git diff --cached --quiet; then
            echo "PDF unchanged."
          else
            git commit -m "Automatically update CV PDF"
            git push
          fi
